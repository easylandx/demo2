<html lang="en">
<head>
<meta charset="UTF-8">

<title>Giuliano Meli — Tadeni</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;1,9..144,400&family=Newsreader:ital,wght@1,400;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0a0a0c;
    --ink: #efe9dd;
    --ink-dim: #a49c8e;
    --gold: #b6905a;
    --gold-dim: #6f5936;
    --bubble-bg: rgba(16,14,13,0.92);
    --ring: rgba(182,144,90,0.55);
  }

  *{ box-sizing: border-box; }

  html,body{
    margin:0;
    padding:0;
    background: var(--bg);
    color: var(--ink);
    height:100%;
    overflow-x:hidden;
  }

  body{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:space-between;
    font-family:'Inter', sans-serif;
    background:
      radial-gradient(ellipse 60% 40% at 50% 0%, rgba(182,144,90,0.06), transparent 60%),
      var(--bg);
    padding: clamp(28px, 5vh, 64px) 20px;
  }

  header{
    text-align:center;
    flex: 0 0 auto;
  }

  .eyebrow{
    display:block;
    font-size: 11px;
    letter-spacing: 0.42em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 14px;
    font-weight: 500;
  }

  h1{
    font-family:'Fraunces', serif;
    font-weight: 300;
    font-style: normal;
    font-size: clamp(28px, 5.4vw, 52px);
    letter-spacing: 0.01em;
    margin: 0;
    color: var(--ink);
  }

  h1 em{
    font-style: italic;
    font-weight: 500;
    color: var(--ink);
  }

  main{
    flex: 1 1 auto;
    display:flex;
    flex-direction: column;
    align-items:center;
    justify-content:center;
    width:100%;
    padding: 12px 0;
    position:relative;
    gap: 8px;
  }

  .bubble-slot{
    width: 100%;
    min-height: clamp(88px, 14vh, 116px);
    display:flex;
    align-items:flex-end;
    justify-content:center;
    padding: 0 16px;
  }

  .portrait-wrap{
    position: relative;
    width: min(78vw, 360px);
    aspect-ratio: 896 / 1136;
    border-radius: 4px;
    cursor: pointer;
    background: #000;
    box-shadow:
      0 0 0 1px rgba(182,144,90,0.18),
      0 30px 80px -20px rgba(0,0,0,0.8);
    -webkit-tap-highlight-color: transparent;
    outline: none;
  }

  .portrait-wrap:focus-visible{
    box-shadow:
      0 0 0 2px var(--ring),
      0 30px 80px -20px rgba(0,0,0,0.8);
  }

  .portrait-wrap img{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit: cover;
    border-radius: 4px;
    transition: opacity 900ms ease;
  }

  .portrait-wrap img.top{
    opacity: 1;
  }

  .portrait-wrap img.bottom{
    opacity: 0;
  }

  .portrait-wrap.swapped img.top{
    opacity: 0;
  }

  .portrait-wrap.swapped img.bottom{
    opacity: 1;
  }

  .pulse-ring{
    position:absolute;
    inset: -1px;
    border-radius: 4px;
    border: 1px solid var(--gold);
    opacity: 0;
    pointer-events:none;
  }

  .pulse-ring.active{
    animation: pulse 900ms ease-out;
  }

  @keyframes pulse{
    0%{ opacity: 0.9; inset: -1px; }
    100%{ opacity: 0; inset: -14px; }
  }

  .bubble{
    position: relative;
    width: 100%;
    max-width: min(78vw, 360px);
    background: var(--bubble-bg);
    border: 1px solid var(--gold-dim);
    border-radius: 3px;
    padding: 16px 26px;
    opacity: 0;
    transform: translateY(8px);
    transition: opacity 500ms ease, transform 500ms ease;
    pointer-events:none;
    text-align:center;
  }

  .bubble::after{
    content:"";
    position:absolute;
    left:50%;
    top:100%;
    transform: translateX(-50%);
    border: 7px solid transparent;
    border-top-color: var(--gold-dim);
  }

  .bubble.visible{
    opacity: 1;
    transform: translateY(0);
  }

  .bubble p{
    margin:0;
    font-family:'Newsreader', serif;
    font-style: italic;
    font-weight: 400;
    font-size: clamp(14px, 2.6vw, 16px);
    line-height: 1.55;
    color: var(--ink);
  }

  footer{
    flex: 0 0 auto;
    text-align:center;
  }

  footer a{
    color: var(--ink-dim);
    text-decoration: none;
    font-size: 12px;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    font-weight: 500;
    border-bottom: 1px solid transparent;
    transition: color 300ms ease, border-color 300ms ease;
    padding-bottom: 3px;
  }

  footer a:hover,
  footer a:focus-visible{
    color: var(--gold);
    border-color: var(--gold-dim);
  }

  .mute-btn{
    display: flex;
    align-items: center;
    justify-content: center;
    width: 38px;
    height: 38px;
    margin: 0 auto 18px;
    border-radius: 50%;
    border: 1px solid var(--gold-dim);
    background: transparent;
    cursor: pointer;
    color: var(--ink-dim);
    transition: color 300ms ease, border-color 300ms ease, background 300ms ease;
    -webkit-tap-highlight-color: transparent;
  }

  .mute-btn:hover,
  .mute-btn:focus-visible{
    color: var(--gold);
    border-color: var(--gold);
    background: rgba(182,144,90,0.08);
  }

  .mute-btn svg{
    width: 17px;
    height: 17px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.6;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .mute-btn .icon-muted{ display:none; }
  .mute-btn.is-muted .icon-sound{ display:none; }
  .mute-btn.is-muted .icon-muted{ display:block; }

  @media (prefers-reduced-motion: reduce){
    .portrait-wrap img,
    .bubble,
    .pulse-ring.active{
      transition: none;
      animation: none;
    }
  }
</style>
</head>

  <footer>
    <button class="mute-btn" id="muteBtn" type="button" aria-pressed="false" aria-label="Mute sound">
      <svg class="icon-sound" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M17 8a5 5 0 0 1 0 8"/><path d="M19.5 5.5a9 9 0 0 1 0 13"/></svg>
      <svg class="icon-muted" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16 9l5 6"/><path d="M21 9l-5 6"/></svg>
    </button>
    <a href="https://tadeniworld.com" target="_blank" rel="noopener">tadeniworld.com</a>
  </footer>

<script>
(function(){
  const wrap = document.getElementById('portrait');
  const bubble = document.getElementById('bubble');
  const bubbleText = document.getElementById('bubbleText');
  const pulseRing = document.getElementById('pulseRing');
  const muteBtn = document.getElementById('muteBtn');

  const phrases = [
    "I believe beauty deserves patience.",
    "Music is one of the oldest languages we possess.",
    "Structure and freedom are not opposites.",
    "Every voice carries a memory.",
    "This world is built for those who still believe art can change the way we see ourselves."
  ];

  let phraseIndex = -1;
  let autoTimer = null;
  let audioCtx = null;
  let muted = false;

  function getAudioCtx(){
    if(!audioCtx){
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    return audioCtx;
  }

  // A single, subtle piano note: a handful of tuned partials with a soft
  // hammer attack and a long, quiet natural decay, gently filtered so it
  // feels warm and distant rather than bright or percussive.
  function playPianoNote(){
    if(muted) return;
    const ctx = getAudioCtx();
    if(ctx.state === 'suspended'){ ctx.resume(); }
    const t = ctx.currentTime + 0.01;

    const freq = 392.00; // a soft G4
    const partials = [
      { mult: 1,    gain: 0.5  },
      { mult: 2,    gain: 0.22 },
      { mult: 3,    gain: 0.09 },
      { mult: 4.02, gain: 0.05 }
    ];

    const master = ctx.createGain();
    master.gain.value = 0.16;

    const tone = ctx.createBiquadFilter();
    tone.type = 'lowpass';
    tone.frequency.value = 2600;
    tone.Q.value = 0.3;

    master.connect(tone);
    tone.connect(ctx.destination);

    partials.forEach(p => {
      const osc = ctx.createOscillator();
      osc.type = 'sine';
      osc.frequency.value = freq * p.mult;

      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(p.gain, t + 0.015);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 2.4);

      osc.connect(g);
      g.connect(master);
      osc.start(t);
      osc.stop(t + 2.5);
    });
  }

  function nextPhrase(){
    phraseIndex = (phraseIndex + 1) % phrases.length;
    return phrases[phraseIndex];
  }

  function trigger(){
    wrap.classList.toggle('swapped');

    playPianoNote();

    pulseRing.classList.remove('active');
    void pulseRing.offsetWidth;
    pulseRing.classList.add('active');

    bubble.classList.remove('visible');
    window.setTimeout(() => {
      bubbleText.textContent = nextPhrase();
      bubble.classList.add('visible');
    }, 120);

    if(autoTimer === null){
      autoTimer = window.setInterval(trigger, 8000);
    }
  }

  wrap.addEventListener('click', trigger);
  wrap.addEventListener('keydown', function(e){
    if(e.key === 'Enter' || e.key === ' '){
      e.preventDefault();
      trigger();
    }
  });

  muteBtn.addEventListener('click', function(){
    muted = !muted;
    muteBtn.classList.toggle('is-muted', muted);
    muteBtn.setAttribute('aria-pressed', String(muted));
    muteBtn.setAttribute('aria-label', muted ? 'Unmute sound' : 'Mute sound');
    if(!muted){
      getAudioCtx();
      if(audioCtx.state === 'suspended'){ audioCtx.resume(); }
    }
  });

  // Unlock audio playback on the first gesture anywhere on the page,
  // since the sequence itself starts automatically without a click.
  function unlockAudio(){
    const ctx = getAudioCtx();
    if(ctx.state === 'suspended'){ ctx.resume(); }
    document.removeEventListener('pointerdown', unlockAudio);
    document.removeEventListener('keydown', unlockAudio);
  }
  document.addEventListener('pointerdown', unlockAudio);
  document.addEventListener('keydown', unlockAudio);

  // Start the sequence on its own, no click required.
  window.setTimeout(trigger, 900);
})();
</script>
